<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Descrições da Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style id="app-css">
/* Layout: lista de títulos à esquerda; à direita o texto pronto, com ajustes rápidos agrupados acima. No celular, uma coluna por vez.
   Paleta: cinza-papel com viés verde, tinta verde-escura, acento verde de campo cirúrgico. Âmbar só para aviso. */
:root {
  --bg: #eef1f0; --painel: #f8faf9; --tinta: #14231f; --suave: #55645f; --linha: #d3dad7;
  --acento: #17695c; --acento-fg: #ffffff; --sel: #dcebe7; --alerta: #8f4a05; --alerta-bg: #f6e8d3;
  --fonte: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1816; --painel: #16211e; --tinta: #e4ede9; --suave: #94a59f; --linha: #2a3a35;
    --acento: #4fb8a5; --acento-fg: #08201b; --sel: #1e332e; --alerta: #e0a050; --alerta-bg: #33260f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1816; --painel: #16211e; --tinta: #e4ede9; --suave: #94a59f; --linha: #2a3a35;
  --acento: #4fb8a5; --acento-fg: #08201b; --sel: #1e332e; --alerta: #e0a050; --alerta-bg: #33260f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--tinta); font-family: var(--fonte); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

.app { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.lista, .detalhe { background: var(--painel); border: 1px solid var(--linha); border-radius: 6px; min-width: 0; }
.lista { padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 16px; max-height: calc(100vh - 32px); }
.topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
.contagem { color: var(--suave); font-size: .85rem; }
.busca { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 6px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--linha); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: .85rem; color: var(--suave); }
.chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--acento-fg); }
.itens { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.item { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--sel); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .c { font-size: .8rem; color: var(--suave); }
.vazio { color: var(--suave); padding: 12px 4px; }
.grupo { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); padding: 14px 10px 4px; border-top: 1px solid var(--linha); margin-top: 6px; }
.grupo:first-child { border-top: 0; margin-top: 0; padding-top: 4px; }
.subgrupo { font-size: .78rem; font-weight: 600; color: var(--suave); padding: 8px 10px 2px; }

.btn { border: 1px solid var(--linha); background: var(--painel); border-radius: 6px; padding: 9px 16px; font-weight: 600; }
.btn.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-fg); font-size: 1.05rem; padding: 10px 24px; }
.btn.perigo { color: var(--alerta); border-color: var(--alerta); }

.detalhe { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-height: 320px; }
.cab { display: flex; flex-direction: column; gap: 4px; }
.cab h2 { margin: 0; font-size: 1.4rem; text-wrap: balance; overflow-wrap: anywhere; }
.meta { color: var(--suave); font-size: .85rem; }
.voltar { display: none; align-self: flex-start; background: transparent; border: 0; padding: 0 0 4px; color: var(--acento); font-weight: 600; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.faltam { color: var(--alerta); font-size: .85rem; font-weight: 600; }
.texto { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--linha); border-radius: 6px; padding: 16px; font-size: 1.05rem; line-height: 1.65; margin: 0; }
textarea.texto { width: 100%; min-height: 55vh; resize: vertical; font-family: inherit; }
.brancos { font: inherit; border: 0; border-bottom: 2px dashed var(--acento); background: var(--sel); border-radius: 3px 3px 0 0; padding: 0 4px; margin: 0 1px; color: var(--tinta); min-width: 2.2ch; max-width: 100%; }
.aviso { background: var(--alerta-bg); color: var(--alerta); border-radius: 6px; padding: 8px 12px; font-size: .9rem; font-weight: 600; }
.nota { color: var(--suave); font-size: .85rem; }

/* painéis de ajuste: um bloco por assunto, recolhível */
details.painel { border: 1px solid var(--linha); border-radius: 6px; }
.painel-fixo { border: 1px solid var(--linha); border-radius: 6px; padding: 9px 12px 12px; }
.titulo-fixo { display: block; font-weight: 700; margin-bottom: 8px; }
.linha-nivel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acoes.fim { position: sticky; bottom: 0; z-index: 2; margin: 14px -20px -20px; padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--painel); border-top: 1px solid var(--linha); border-radius: 0 0 6px 6px; }
.mudancas { font-size: .85rem; color: var(--acento); background: var(--sel); border-radius: 6px; padding: 6px 10px; line-height: 1.4; overflow-wrap: anywhere; }
.mudancas[hidden] { display: none; }
.mudancas b { font-weight: 700; }
.aviso-ms { color: var(--alerta); font-size: .85rem; font-weight: 600; }
details.painel > summary { cursor: pointer; font-weight: 700; padding: 9px 12px; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
details.painel > summary::-webkit-details-marker { display: none; }
details.painel > summary::after { content: "+"; color: var(--acento); font-weight: 700; }
details.painel[open] > summary::after { content: "–"; }
details.painel .cont { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
.sub { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--acento); }
.ajustes { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.aj { display: flex; flex-direction: column; gap: 4px; }
.aj .r { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--linha); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--linha); background: transparent; padding: 7px 12px; min-width: 40px; font-weight: 600; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--acento); color: var(--acento-fg); }
.aj select, .cartao select { padding: 7px 10px; border: 1px solid var(--linha); border-radius: 6px; background: var(--bg); min-width: 76px; max-width: 100%; }
.aj select[data-mudou="1"] { border-color: var(--acento); font-weight: 700; }
.limpar { background: transparent; border: 0; color: var(--acento); text-decoration: underline; font-size: .85rem; padding: 7px 0; }
.cartoes { display: flex; flex-direction: column; gap: 8px; }
.cartao { border: 1px solid var(--linha); border-radius: 6px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--bg); }
.cartao .nome { font-weight: 700; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.cartao .tira { background: transparent; border: 0; color: var(--alerta); font-weight: 700; padding: 4px 6px; }
.dose { padding: 7px 8px; border: 1px solid var(--linha); border-radius: 6px; background: var(--painel); width: 9ch; }
.regioes { display: flex; flex-wrap: wrap; gap: 6px; }
.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form input { padding: 8px 10px; border: 1px solid var(--linha); border-radius: 6px; background: var(--bg); min-width: 220px; }
.usoaviso { margin: 6px 0 10px; padding: 8px 10px; border-left: 3px solid var(--alerta); background: var(--alerta-bg); color: var(--alerta); font-size: .85rem; line-height: 1.35; border-radius: 4px; }
.rodape { max-width: 1100px; margin: 12px auto 0; color: var(--suave); font-size: .85rem; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lista { position: static; max-height: none; }
  .app[data-vista="lista"] .detalhe { display: none; }
  .app[data-vista="detalhe"] .lista { display: none; }
  .voltar { display: inline-block; }
  .detalhe { padding: 16px; }
  .acoes.fim { margin: 14px -16px -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .btn.prim { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

, {"id": "i014", "titulo": "Faco / oftalmo (sedação)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica e entregado anestésico oftálmico.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Venóclise 22g MSE punção única com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Sedação leve e consciente para ansiólise e oclusão ocular + suporte de O2 em mistura 50/50 de ar e O2 em cateter nasal 2L/min.\n- Posicionamento em DDH, com mmss ao longo e protegidos, proteção de zonas de pressão periodicamente checada. Cabeça fixada na testa para imobilidade de cabeça.\n- Ao término, zonas de pressão reavaliadas, sem lesões evidenciadas.\n- Ao término do procedimento, sem intercorrências, paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA sem queixas, com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i015", "titulo": "Ombro, cadeira de praia (IOT + interescalênico)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Venóclise 20G MSE punção única, asséptica, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Sedação consciente.\n- Bloqueio interescalênico asséptico em MSD com USG + NE (sem estímulos < 0,5), ropivacaína 0,375% 15ml + dexametasona 4mg, com lateralidade conferida conforme marcação cirúrgica, sem déficit neurológico prévio no território, aspiração negativa e injeção fracionada, sem dor ou parestesia à injeção, sem sinais de toxicidade sistêmica, sem intercorrências ou queixas do paciente. Paciente orientado quanto à dormência e à proteção do membro bloqueado.\n- Denitrogenação com O2 a 90% sob máscara facial.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- INTUBAÇÃO OROTRAQUEAL atraumática com laringoscopia direta: sem sangramentos proveniente da passagem do ETT pela orofaringe, Cormack 1, sonda aramada com cuff número 7,5 posicionada a 25 cm da rima. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com micropore.\n- Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + filme plástico.\n- Posicionamento em cadeira de praia, com MSD em campo e MSE protegido em ângulo < 90o, com coxins infragenicular, calcâneos e cabeça em protetor específico e protegida, orelhas, olhos e resto da face livres e protegidos, proteção de zonas de pressão periodicamente checadas.\n- PAM mantida conforme inicial, PAs > 90 em todo procedimento.\n- Instalação de meias elásticas de compressão média e manta térmica inferior. Normotermia mantida.\n- Ao término do procedimento, paciente descurarizado, aspiração e extubação com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Ao término, reavaliados dentição e lábios, olhos e zonas de pressão, sem lesões evidenciadas.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i016", "titulo": "Robô, próstata (IOT)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- AVP 20G MSE, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Denitrogenação com O2 a 90% sob máscara facial.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- INTUBAÇÃO OROTRAQUEAL atraumática com laringoscopia direta, utilizado fio guia: sem sangramentos proveniente da passagem do ETT pela orofaringe, Cormack 1, sonda simples com cuff número 8,0 posicionada a 24 cm da rima. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com multifix.\n- Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + filme plástico.\n- SNG calibrosa + termômetro passados sem resistência.\n- AVP 18G MSD, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Posicionamento em DDH, com mmss ao longo protegidos com espuma, com mmii em litotomia (em perneiras acolchoadas) e coxim occipital + proteção lombar, proteção de zonas de pressão periodicamente checada, todos acessos funcionantes, cinta instalada em tórax bem aplicada com suporte para Trendelenburg acentuado.\n- Instalação de meias elásticas de compressão média, meias compressoras pneumáticas e manta térmica superior.\n- Ao término do procedimento, paciente descurarizado, aspiração e extubação com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Ao término, reavaliados dentição e lábios, olhos e zonas de pressão, sem lesões evidenciadas.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i017", "titulo": "RTU com ML", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica. Limites práticos sugeridos: tempo < 90 minutos. Altura de soros de infusão < 60cm acima do púbis. Glicemia inicial + h/h. Manutenção de curarização durante procedimento.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Venóclise funcionante, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Denitrogenação com O2 a 90% sob máscara facial.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- Passagem de máscara laríngea lubrificada com gel sem resistência ou intercorrências.\n- Dentição e lábios conferidos antes e após a passagem da máscara laríngea, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + filme plástico.\n- Posicionamento em DDH, com mmss abduzidos < 90 graus, com perneira acolchoada e apropriada para mmii e coxim occipital, proteção de zonas de pressão periodicamente checada.\n- Instalação de meias elásticas de compressão média, meias compressoras pneumáticas e manta térmica superior.\n- Ao término do procedimento, paciente descurarizado, retirada de máscara laríngea com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Ao término, reavaliados dentição e lábios, olhos e zonas de pressão, sem lesões evidenciadas.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i018", "titulo": "Coluna, decúbito ventral (IOT)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização. Realizado manejo ativo de prevenção de hipotermia, manta ligada pré-indução, ar desligado.\n- Venóclise 18G MSD, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Denitrogenação com O2 a 90% sob máscara facial.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- INTUBAÇÃO OROTRAQUEAL atraumática com laringoscopia direta: sem sangramentos proveniente da passagem do ETT pela orofaringe, Cormack 1, sonda aramada com cuff número 7,5 posicionada a 22 cm da rima. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com micropore.\n- Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + gaze + filme plástico.\n- Proteção de língua com rolo de gaze, colocação de mepilex em regiões de pressão em quadril (bi-ilíaco), costela (rebordo costal a inframamário), afastamento de mamas, e face (frontal, bi-zigomático, mentoniano).\n- Posicionamento em ventral, com mmss abduzidos 90 graus ao lado da cabeça, com coxins sob torso bi-ilíaco + tóracico bilateral, mantendo tórax e abdômen livres, joelhos, pés e calcâneos protegidos sem extensão exagerada, travesseiro sob pernas e coxim apropriado em face, proteção de zonas de pressão periodicamente checada, olhos e regiões sensíveis do rosto livres. A cada 2 horas realizada descompressão de face com técnica de aprofundamento do coxim facial.\n- Instalação de meias elásticas de compressão média, meias compressoras pneumáticas e manta térmica superior. Termômetro passado sem resistência.\n- Ao término do procedimento, paciente virado para DDH, avaliação de regiões de pressão, face, olhos, dentição e lábios, sem lesões evidenciadas.\n- Paciente descurarizado, aspiração e extubação com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i019", "titulo": "Neurocirurgia, DLD oblíquo (paciente da UTI, intubado)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Identificação do paciente e transporte da UTI ao centro cirúrgico: paciente sedado, RASS -5, pupilas anisocóricas (E>D), IOT +VM, CVC VFD recebendo noradrenalina ___ mL/h\n- Venóclise funcionante, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Acoplamento à ventilação mecânica em aparelho de anestesia. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente).\n- Proteção ocular bilateral com pomada ocular + filme plástico.\n- Novo AVP 18G em MSD punção única, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Cateterização de artéria radial direita: procedimento realizado sob técnica asséptica após a realização do Teste de Allen modificado adequado. Punção com Jelco 20G sem intercorrências, para monitorização hemodinâmica contínua e coleta seriada de exames. Realizo curativo. PAM calibrada em altura do meato, mantida para garantir perfusão neurológica, PAm > 90 em todo procedimento.\n- Posicionamento em DLD oblíquo, com mmss ao longo, com coxins axilar (axila livre), intergenicular, inter calcâneos, cabeça fixada em Mayfield (pinado sem intercorrências) proteção de zonas de pressão periodicamente checada, fixação de paciente com esparadrapo + cinta.\n- Instalação de meias compressoras pneumáticas e manta térmica corpo inteiro.\n- Cirurgia liberada\n- Assistência clínica e manutenção com anestesia venosa total:\n    *ATB profilaxia: Cefuroxima 1,5g às __:__\n    *Reposição volêmica: ___ mL Ringer Lactato no intra-op\n    *Transfusão sanguínea: ___\n    *Diurese: ___\n    *Sintomáticos: ___\n    *Exames: gasometrias pareadas (Hb __ às __:__ - corrigido com ___)", "atualizado": "2026-10-28"}, {"id": "i020", "titulo": "Neurocirurgia, DDH com scalp block (extubado)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Identificação do paciente.\n- Venóclise funcionante, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- INTUBAÇÃO OROTRAQUEAL atraumática com laringoscopia direta: sem sangramentos proveniente da passagem do ETT pela orofaringe, Cormack 1, sonda simples com cuff número 8,0 posicionada a 24 cm da rima. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com micropore.\n- Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + filme plástico + gaze.\n- Termômetro passado sem resistência.\n- Realizado bloqueio scalp block com ropivacaína 0,5% 20ml (1,5-2ml por ponto), em 12 pontos (supraorbital/supratroclear + zigomático-temporal + auriculotemporal + auricular magno + occipital maior + occipital menor bilateralmente), aspiração negativa e injeção fracionada, sem sinais de toxicidade sistêmica, sem intercorrências, técnica asséptica com agulha fina de insulina.\n- Novo AVP 18G em MSD punção única, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Cateterização de artéria radial direita: procedimento realizado sob técnica asséptica após a realização do Teste de Allen modificado adequado. Punção com Jelco 20G sem intercorrências, para monitorização hemodinâmica contínua e coleta seriada de exames. Realizo curativo. PAM calibrada em altura do meato, mantida para garantir perfusão neurológica, PAm > 90 em todo procedimento.\n- Cateter venoso central: procedimento realizado sob técnica asséptica e guiado por ultrassom. Punção de VJID com a técnica de Seldinger e passagem de cateter duplo-lúmen 7 Fr sem intercorrências. Checo com ultrassom. Teste de fluxo e refluxo de todas as vias OK. Fixação com 3 pontos e realização de curativo estéril.\n- Posicionamento em DDH, com mmss ao longo, com coxins infragenicular, calcâneos e occipital, proteção de zonas de pressão periodicamente checada, cabeça fixada em Mayfield (pinado sem intercorrências) proteção de zonas de pressão periodicamente checada, fixação de paciente com esparadrapo + cinta.\n- Instalação de meias compressoras pneumáticas e manta térmica corpo inteiro.\n- Cirurgia liberada\n- Assistência clínica e manutenção com anestesia venosa total:\n    *ATB profilaxia: Cefuroxima 1,5g às __:__\n    *Reposição volêmica: ___ mL Ringer Lactato no intra-op\n    *Transfusão sanguínea: ___\n    *Diurese: ___\n    *Sintomáticos: ___\n    *Exames: gasometrias pareadas (Hb __ às __:__ - corrigido com ___)\n- Ao término do procedimento, paciente descurarizado, aspiração e extubação com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Ao término, reavaliados dentição e lábios, olhos e zonas de pressão, sem lesões evidenciadas.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i021", "titulo": "Septoplastia / face simples / ORL / CCP simples / artrodese cervical anterior (IOT)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Venóclise 22g MSD punção única com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Denitrogenação com O2 a 90% sob máscara facial.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- INTUBAÇÃO OROTRAQUEAL atraumática com laringoscopia direta: sem sangramentos proveniente da passagem do ETT pela orofaringe, Cormack 1, sonda aramada com cuff número 7,0 posicionada a 24 cm da rima. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com micropore.\n- Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + filme plástico + gaze.\n- Posicionamento em DDH, com ligeiro cefaloaclive de 15 graus para melhor drenagem, com mmss ao longo protegidos, com coxins infragenicular, calcâneos e occipital, proteção de zonas de pressão periodicamente checada.\n- Instalação de meias elásticas de compressão média, meias compressoras pneumáticas e manta térmica superior.\n- Ao término do procedimento, paciente descurarizado, aspiração de orofaringe e estômago + aspiração prévia por equipe cirúrgica, extubação com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Ao término, reavaliados dentição e lábios, olhos e zonas de pressão, sem lesões evidenciadas.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i022", "titulo": "CCP grande (IOT + CVC + arterial)", "cat": "Por cirurgia", "texto": "- Chegada do anestesista à SO.\n- Aparelhos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n- Aguardamos a equipe de cirurgia. Discutido caso com a equipe cirúrgica.\n- Paciente admitido em sala. Me apresento e explico anestesia. Avaliação pré-anestésica OK e TCLE assinado.\n- Time-out realizado conforme protocolo institucional.\n- Monitorização.\n- Venóclise funcionante, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Denitrogenação com O2 a 90% sob máscara facial.\n- Indução anestésica venosa guiada por valores de BIS (limiar mantido de consciência 45-60) e mantendo estabilidade hemodinâmica.\n- INTUBAÇÃO OROTRAQUEAL atraumática com laringoscopia direta: sem sangramentos proveniente da passagem do ETT pela orofaringe, Cormack 1, sonda aramada com cuff número 7,5 posicionada a 24 cm da rima. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com micropore.\n- Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n- Ausculta pulmonar bilateral simétrica, ETCO2 ok.\n- Proteção ocular bilateral com pomada ocular + filme plástico.\n- Posicionamento em DDH, com mmss abduzidos 90 graus, dorso elevado 30º, com coxins infragenicular, calcâneos e occipital, proteção de zonas de pressão periodicamente checada.\n- Novo AVP 18G em MSD, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n- Cateter venoso central: procedimento realizado sob técnica asséptica e guiado por ultrassom. Punção de Veia Femoral Esquerda com a técnica de Seldinger e passagem de cateter triplo lúmen 7 Fr sem intercorrências. Checo com ultrassom. Teste de fluxo e refluxo de todas as vias OK. Fixação com 3 pontos e realização de curativo estéril.\n- Cateterização de artéria radial esquerda: procedimento realizado sob técnica asséptica após a realização do Teste de Allen modificado OK. Punção com kit 20G sem intercorrências, para monitorização hemodinâmica contínua e coleta seriada de exames. Realizo curativo.\n- Instalação de meias elásticas de compressão média, meias compressoras pneumáticas e manta térmica superior.\n- Ao término do procedimento, paciente descurarizado, aspiração e extubação com ventilação regular e volume adequado (pré extubação em PSV sustentada com pressão suporte 7, peep 5, trigger 3) e abertura ocular espontânea, sem intercorrências.\n- Ao término, reavaliados dentição e lábios, olhos e zonas de pressão, sem lesões evidenciadas.\n- Paciente estável, transportado monitorizado e com O2 suplementar, encaminhado para a RPA com passagem de caso à equipe.", "atualizado": "2026-10-28"}, {"id": "i023", "titulo": "IOT nasal com videolaringoscopia, CVC e arterial (ficha numerada)", "cat": "Ficha numerada", "texto": "1 - Aparelhos e equipamentos checados. Preparo de drogas anestésicas, materiais de vias aéreas e aspiração.\n2 - Avaliação pré-anestésica OK e TCLE assinado.\n3 - Entrada do paciente em sala: me apresento e explico anestesia. Esclareço dúvidas. Paciente em REG, LOTE, Glasgow 15, com ___. Converso que faremos anestesia tópica e ansiólise para fazer avaliação da via aérea, e caso não seja encontrada dificuldades na laringoscopia, procederemos com indução anestésica habitual. Paciente ciente e de acordo. Time-out realizado conforme protocolo institucional.\n4 - Transferência do paciente da maca para a mesa de cirurgia com \"transfer\" em conjunto com equipe cirúrgica e de enfermagem.\n5 - Realizo monitorização básica do paciente com cardioscópio (ritmo cardíaco sinusal e regular), PANI em MSD ( PA ___ x ___ mmHg), oxímetro de pulso (SpO2 ___ % e FC ___ bpm), e sensor de BIS em região frontal da cabeça (BIS de ___)\n6 - Checo venóclise prévia: 22G em MSE não funcionante. Puncionado novo AVP 20G em MSE com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n7 - Pré-oxigenação com O2 a 90% sob máscara facial e sedação consciente com bolus intermitente de Fentanil. Anestesia tópica da língua, boca, orofaringe com atomizador e Lidocaína 2%. Paciente confortável durante procedimento. Realizo videolaringoscopia, com boa visualização da região glótica, sem distorções anatômicas.\n8 - Aplico vasoconstritor nasal em narina direita + Indução anestésica venosa guiada por valores de BIS e mantendo estabilidade hemodinâmica + aplicação de lidocaína gel em narina direita\n9 - INTUBAÇÃO NASOTRAQUEAL atraumática com videolaringoscopio (McGrath): sem sangramentos proveniente da passagem do ETT pela nasofaringe, Cormack 1, sonda aramada com cuff número 6,5 posicionada a 26 cm da abertura nasal direita. Insuflo cuff. Ventilação confirmada com capnografia (curva positiva e retangular com ETCO2 = 37 mmHg) e ausculta pulmonar (MV presente e simétrico bilateralmente). Fixo sonda com micropore. Dentição e lábios conferidos antes e após a laringoscopia, sem lesões.\n10 - Acoplo a ventilação mecânica invasiva modo VCV:  Vc ___, FR ___, FiO2 ___%, PEEP ___.\n11 - Realizo proteção ocular bilateral: gel oftálmico + oclusão com filme plástico\n12 - Novo AVP 18G em MSD, com bom fluxo e sem sinais de infiltração com flush de soro fisiológico.\n13 - Cateter venoso central: procedimento realizado sob técnica asséptica e guiado por ultrassom. Punção de Veia Femoral Esquerda com a técnica de Seldinger e passagem de cateter triplo lúmen 7 Fr sem intercorrências. Checo com ultrassom. Teste de fluxo e refluxo de todas as vias OK. Fixação com pontos em bailarina e realização de curativo estéril.\n14 - Cateterização de artéria radial direita: procedimento realizado sob técnica asséptica após a realização do Teste de Allen modificado OK. Punção com Jelco 20G sem intercorrências, para monitorização hemodinâmica contínua e coleta seriada de exames. Realizo curativo.\n15 - Paciente posicionado em DDH com braços ao longo do corpo e proteção de zonas de pressão.\n16 - Cirurgia liberada\n17 - Assistência clínica e manutenção com anestesia venosa total:\n    *ATB profilaxia: Metronidazol 500mg e Cefazolina 2g às __:__ horas. Repiques: Cefazolina 1g às __h / Cefazolina 1g às __h /\n    *Reposição volêmica: ___ mL Ringer Lactato no intra-op\n    *Diurese: ___\n    *Sintomáticos: ___\n    *Exames: gasometrias pareadas (Glicemia ___ às __h - corrigido com Insulina Regular ___ UI EV )", "atualizado": "2026-10-28"}, {"id": "b001", "titulo": "Interescalênico", "cat": "Bloqueios", "bq": "isb", "sub": "Membro super (USG)", "cat": "Blocos avulsos", "texto": "- Cateter venoso central: procedimento realizado sob técnica asséptica e guiado por ultrassom. Punção de Veia Jugular Direita com a técnica de Seldinger e passagem de cateter triplo lúmen 7 Fr sem intercorrências. Checo com ultrassom. Teste de fluxo e refluxo de todas as vias OK. Fixação com pontos em bailarina e realização de curativo estéril.", "atualizado": "2026-10-28"}, {"id": "i030", "titulo": "Artéria radial direita", "cat": "Blocos avulsos", "texto": "- Cateterização de artéria radial direita: procedimento realizado sob técnica asséptica após a realização do Teste de Allen modificado OK. Punção com Jelco 20G sem intercorrências, para monitorização hemodinâmica contínua e coleta seriada de exames. Realizo curativo.", "atualizado": "2026-10-28"}, {"id": "i031", "titulo": "Sequência rápida (SR)", "cat": "Blocos avulsos", "texto": "- Denitrogenação com O2 a 100% sob máscara facial bem acoplada, fluxo de 10 L/min.\n- Realizada manobra de Sellick e mantida até confirmação de IOT. Indução anestésica venosa em sequência rápida mantendo estabilidade hemodinâmica. Decúbito elevado 30º, sniff position. Técnica No-Desat O2 15L/min.", "atualizado": "2026-10-28"}, {"id": "i032", "titulo": "Fibroscopia nasal (IOT acordado)", "cat": "Blocos avulsos", "texto": "- Pré-oxigenação com O2 a 100% sob cateter nasal 2L/min por 10mins.\n- Paciente sob sedação consciente, realizada anestesia tópica em cavidade oral e nasal com solução paste lidocaína 2% e lidocaína líquida 2% 10ml, além de preparo nasal com oximetazolina.\n- Realizada anestesia translaríngea com jelco 20G, punção de membrana cricotireóidea sem intercorrências, aspiração de ar, mantido jelco e injetado 2ml lidocaína.\n- Passagem sem resistência de TOT aramado #6,0 por narina E, anestesia \"spray as you go\" com fibroscópio em epiglote e cordas vocais.\n- Introduzido TOT até 2cm da carina, fixação de TOT.\n- Paciente calmo e colaborativo em todo procedimento. ETCO2 confirmado, realizo indução.", "atualizado": "2026-10-28"}, {"id": "i033", "titulo": "Pedido de ressonância com anestesia: pacientes da UTI", "cat": "Respostas padrão", "texto": "_A avaliação dos pacientes que necessitem de Anestesia Geral (exame NÃO é realizado sob sedação) ou que estejam em ventilação mecânica que estejam internados em UTI será realizada no dia do exame, pois podem apresentar labilidade no quadro clínico. A equipe de anestesiologia aguardará o paciente no setor da RNM, ficando o acompanhamento clínico durante a transferência entre os setores sob responsabilidade da equipe da UTI. Lembramos que bombas de infusão não são compatíveis com o exame devido ao campo magnético._\n_Favor ligar para equipe anestesia no ramal ____ quando familiar ou responsável presente para assinatura do Termo de Consentimento, caso paciente confuso ou impossibilitado de assinatura do documento._\n_Caso não haja necessidade de Anestesia Geral ou o paciente em ventilação espontânea, a realização do exame será acompanhada em sua totalidade pela equipe da UTI._", "atualizado": "2026-10-28"}], "bloqueios": [{"id": "isb", "nome": "Interescalênico", "regiao": "Membro superior", "lado": "ms", "texto": "- Realizado bloqueio periférico interescalênico em {lado} guiado por USG + NE (sem estímulo < 0,5 mA), com {dose} + dexametasona 4mg, com lateralidade conferida conforme marcação cirúrgica, sem déficit neurológico prévio no território, aspiração negativa e injeção fracionada, sem dor ou parestesia à injeção, sem sinais de toxicidade sistêmica, sem intercorrências, procedimento asséptico. Paciente orientado quanto à dormência e à proteção do membro bloqueado.", "bilat": false, "padrao": "D", "dose": {"a": "ropivacaína", "c": "0,375%", "v": "15ml"}}, {"id": "stb", "nome": "Tronco superior", "regiao": "Membro superior", "lado": "ms", "texto": "- Realizado bloqueio periférico do tronco superior em {lado}, com {dose} guiado por USG, com lateralidade conferida conforme marcação cirúrgica, sem déficit       if (d) out.push('+ ' + d.nome + (d.lado === 'nenhum' ? '' : b.lado === 'B' ? ' bilateral' : ' ' + b.lado));
    });
    ORDEM_INV.forEach(function (id) {
      var o = est.inv[id]; if (!o) return;
      var def = INV[id], existe = acha(linhas, def.re, id === 'avp2' ? acha(linhas, LINHA_ACESSO) : undefined) >= 0;
      if (o.on === false) out.push('sem ' + def.rot);
      else if (!existe && o.on === true) out.push('+ ' + def.rot);
      else if (existe) out.push(def.rot + ' alterado');
    });
    if (est.c.cab) { var asa = valorBranco(CAB_ASA); out.push(asa ? 'ASA ' + asa : 'ASA e cirurgia'); }
    return out;
  }
  function atualizarFaixa(it) {
    var n = document.getElementById('mudancas'); if (!n || !it) return;
    var m = mudancas(it);
    n.hidden = !m.length;
    n.replaceChildren(el('b', { text: 'Mudado: ' }), document.createTextNode(m.join(' · ')));
  }

  /* ---------- detalhe ---------- */
  function copiar(texto, alvo, btn, rotulo) {
    var antes = rotulo || btn.textContent;
    function fim(t) { btn.textContent = t; setTimeout(function () { btn.textContent = antes; }, 2200); }
    var pronto = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(texto) : Promise.reject();
    pronto.then(function () { fim('Copiado'); }, function () {
      if (alvo && alvo.select) { alvo.select(); }
      else if (alvo) { var r = document.createRange(); r.selectNodeContents(alvo); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      fim('Selecionado: Ctrl+C');
    });
  }
  function inputBranco(i, k, token) {
    var v = est.vazios[k] || '';
    return el('input', { class: 'brancos', type: 'text', placeholder: token, value: v, 'data-chave': k, 'aria-label': 'Campo para preencher ' + (i + 1), size: Math.max(3, v.length + 1, Math.min(token.length, 6)),
      oninput: function (e) { est.vazios[k] = e.target.value; e.target.size = Math.max(3, e.target.value.length + 1); atualizarFaltam(itemAtual()); } });
  }
  function textoComCampos(texto) {
    var partes = texto.split(BRANCO), brancos = texto.match(BRANCO) || [], ks = chavesBrancos(texto);
    var cont = el('div', { class: 'texto', id: 'texto-atual' });
    partes.forEach(function (p, i) { cont.appendChild(document.createTextNode(p)); if (i < brancos.length) cont.appendChild(inputBranco(i, ks[i], brancos[i])); });
    return cont;
  }
  function formReceita(it) {
    var nome = el('input', { id: 'rec-nome', type: 'text', value: it.titulo, 'aria-label': 'Nome da receita' });
    var salvar = el('button', { class: 'btn prim', type: 'button', text: 'Salvar', onclick: function () {
      var n = nome.value.trim() || it.titulo;
      receitas.push({ id: 'r' + Date.now().toString(36), nome: n, base: it.id, est: clone({ campos: est.campos, c: est.c, bq: est.bq, bqx: est.bqx, inv: est.inv, pos: est.pos }) });
      est.msg = gravarReceitas() ? 'Receita salva neste aparelho.' : 'Este navegador não deixa salvar. A receita vale só até fechar a página.';
      est.salvarAberto = false; desenhar();
    } });
    return el('div', { class: 'form' }, [nome, salvar, el('button', { class: 'btn', type: 'button', text: 'Cancelar', onclick: function () { est.salvarAberto = false; desenhar(); } })]);
  }
  function painelDetalhe(it) {
    var rec = sel.rid ? receitas.filter(function (r) { return r.id === sel.rid; })[0] : null;
    var alvo, corpo;
    if (est.edit) {
      alvo = el('textarea', { class: 'texto', id: 'texto-edit', 'aria-label': 'Texto para editar' });
      alvo.value = est.textoEdit;
      alvo.addEventListener('input', function (e) { est.textoEdit = e.target.value; atualizarFaltam(it); });
      corpo = alvo;
    } else { corpo = textoComCampos(compor(it)); }
    function botaoCopiar(rot) {
      var b = el('button', { class: 'btn prim', type: 'button', text: rot }), armado = false;
      b.addEventListener('click', function () {
        var f = faltam(it);
        if (f > 0 && !armado) { // campos em branco: avisa no 1º toque, copia no 2º
          armado = true; b.textContent = 'Copiar mesmo assim (' + f + ' em branco)'; return;
        }
        armado = false;
        copiar(textoParaCopiar(it), est.edit ? corpo : document.getElementById('texto-atual'), b, rot);
      });
      return b;
    }
    var bCopiar = botaoCopiar('Copiar');
    var acoes = [bCopiar,
      est.edit
        ? (function () {
            var armado = false, b = el('button', { class: 'btn', type: 'button', text: 'Voltar às escolhas (descarta a edição)' });
            b.addEventListener('click', function () {
              if (!armado && est.textoEdit !== preencher(compor(it))) { armado = true; b.textContent = 'Confirmar: descartar a edição'; b.className = 'btn perigo'; return; }
              est.edit = false; desenhar();
            });
            return b;
          })()
        : el('button', { class: 'btn', type: 'button', text: 'Editar texto', onclick: function () { est.textoEdit = preencher(compor(it)); est.edit = true; desenhar(); } }),
      rec
        ? el('button', { class: 'btn perigo', type: 'button', text: est.confirmaRemover ? 'Confirmar: remover receita' : 'Remover receita', onclick: function () {
            if (!est.confirmaRemover) { est.confirmaRemover = true; desenhar(); return; }
            receitas = receitas.filter(function (r) { return r.id !== rec.id; }); gravarReceitas();
            sel = null; vista = 'lista'; est = novoEstado(); desenhar();
          } })
        : (est.edit ? null : el('button', { class: 'btn', type: 'button', text: 'Salvar como receita', onclick: function () { est.salvarAberto = !est.salvarAberto; desenhar(); } })),
      el('span', { class: 'faltam', id: 'faltam', role: 'status' })
    ];
    var nodos = [
      el('button', { class: 'voltar', type: 'button', text: '< Voltar à lista', onclick: function () { vista = 'lista'; desenhar(); } }),
      el('div', { class: 'cab' }, [el('h2', { text: rec ? rec.nome : it.titulo }),
        el('span', { class: 'meta', text: rec ? 'Receita salva neste aparelho · base: ' + it.titulo : it.cat })]),
      el('div', { class: 'mudancas', id: 'mudancas', role: 'note', hidden: true }),
      el('div', { class: 'acoes' }, acoes),
      est.msg ? el('div', { class: 'nota', role: 'status', text: est.msg }) : null,
      est.salvarAberto ? formReceita(it) : null,
      est.edit ? el('div', { class: 'aviso', text: 'Edição livre: o que você escrever aqui é o que será copiado. Para mexer nas escolhas, volte a elas.' }) : ajustesDe(it),
      corpo,
      el('div', { class: 'acoes fim' }, [botaoCopiar('Copiar texto final')])
    ];
    var sec = el('section', { class: 'detalhe', 'aria-label': 'Descrição' }, nodos);
    setTimeout(function () { atualizarFaltam(it); }, 0);
    return sec;
  }
  function painelInicial() {
    return el('section', { class: 'detalhe', 'aria-label': 'Descrição' }, [
      el('div', { class: 'cab' }, [el('h2', { text: 'Escolha uma descrição' }),
        el('span', { class: 'meta', text: 'Abra um título e toque em Copiar. Se precisar, ajuste tubo, Cormack, acessos, bloqueios, proteção ou posição antes.' })])
    ]);
  }
  function desenhar() {
    var it = itemAtual();
    var abertos = [];
    [].forEach.call(document.querySelectorAll('details.painel'), function (d) { abertos.push(d.open); });
    var detalhe = it ? painelDetalhe(it) : painelInicial();
    var rod = el('div', { class: 'rodape' }, [el('span', { text: 'Página sem dado de paciente: nada é enviado, tudo roda no seu navegador. Receitas e doses salvas ficam só neste navegador. Não digite dados que identifiquem pacientes.' })]);
    var dl = el('datalist', { id: 'lista-conc' }, ['0,2%', '0,25%', '0,375%', '0,5%', '0,75%'].map(function (c) { return el('option', { value: c }); }));
    raiz.replaceChildren(el('div', { class: 'app', 'data-vista': vista }, [painelLista(), detalhe]), rod, dl);
    [].forEach.call(document.querySelectorAll('details.painel'), function (d, i) { if (abertos[i]) d.open = true; });
  }

  normalizarBase();
  desenhar();
})();
</script>
</body>
